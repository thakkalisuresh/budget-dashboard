<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Budget Tracker</title>
    <meta name="description" content="Personal budget dashboard" />
    <meta name="theme-color" content="#e07c00" />
    <!-- Geist loaded via @fontsource-variable/geist npm package (index.css) -->

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function(){
        /* FOUC prevention: restore --accent-hue before React mounts */
        var h = localStorage.getItem('budget_accent_hue') || localStorage.getItem('budget_theme_hue');
        if (h) document.documentElement.style.setProperty('--accent-hue', h);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
