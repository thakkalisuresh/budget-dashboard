name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Frontend build-time config (Vite VITE_* vars). On GitHub Actions they come
# from repository variables (Settings
# → Secrets and variables → Actions → Variables). Non-secret — they are baked
# into the shipped client bundle. Applied workflow-wide so every `npm run build`
# (smoke test + the deploy jobs) produces a functional bundle.
env:
  VITE_SHEET_ID: ${{ vars.VITE_SHEET_ID }}
  VITE_TEMPLATE_SHEET_ID: ${{ vars.VITE_TEMPLATE_SHEET_ID }}
  VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
  VITE_ALLOWED_EMAILS: ${{ vars.VITE_ALLOWED_EMAILS }}
  VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Audit what actually ships, in both packages.
      #
      # --omit=dev on purpose: the previous gate audited dev dependencies too,
      # so CI could go red because ESLint's glob matcher had a slow-path DoS or
      # PostCSS could read a source map it was pointed at — neither of which is
      # reachable in this pipeline, and neither of which ends up in the browser
      # bundle. That blocked a release on 2026-07-29 for zero security benefit.
      # A deploy gate that fails on things you don't deploy trains you to
      # ignore it, which is how a real advisory eventually slips through.
      # Dependabot still tracks dev-dependency advisories separately.
      #
      # functions/ is audited too, and was NOT before — which is how a high
      # severity form-data CRLF injection sat unnoticed in the deployed
      # backend while the gate policed the build toolchain. Lockfile-only, so
      # it needs no second npm ci.
      - name: Audit dependencies (app)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dependencies (functions runtime)
        working-directory: functions
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Live deploy to Firebase on pushes to main/develop. Deploy target is the
  # single project `fundient-dashboard`. Requires the FIREBASE_SERVICE_ACCOUNT
  # repo secret (a CI service-account JSON key) — until that exists, this job
  # skips gracefully so the `ci` gate stays green.
  deploy-live:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy secret
        id: secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT not set — skipping Firebase deploy."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.present == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.secret.outputs.present == 'true'
        run: npm ci

      - name: Build frontend
        if: steps.secret.outputs.present == 'true'
        run: npm run build

      # The firebase CLI loads functions/index.js to discover the exported
      # functions before deploy, so its dependencies must be installed locally.
      - name: Install functions dependencies
        if: steps.secret.outputs.present == 'true'
        run: npm ci
        working-directory: functions

      - name: Write service account key
        if: steps.secret.outputs.present == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy functions + hosting
        if: steps.secret.outputs.present == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx --yes firebase-tools@^13 deploy --only functions,hosting --project fundient-dashboard --non-interactive

      - name: Remove service account key
        if: always() && steps.secret.outputs.present == 'true'
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

  # Hosting preview channel for PRs. Preview channels are hosting-only; their
  # /api/* rewrites resolve to the live Cloud Functions. Skips gracefully if the
  # service-account secret is absent.
  deploy-preview:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # action-hosting-deploy creates a check run and posts the preview URL as a PR
    # comment via GITHUB_TOKEN; without these scopes it fails at createCheck with
    # "Resource not accessible by integration". contents:read is needed for checkout.
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Check deploy secret
        id: secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT not set — skipping preview deploy."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.present == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.secret.outputs.present == 'true'
        run: npm ci

      - name: Build frontend
        if: steps.secret.outputs.present == 'true'
        run: npm run build

      - name: Deploy preview channel
        if: steps.secret.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fundient-dashboard
          expires: 7d
