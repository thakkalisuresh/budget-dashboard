[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "dist,src/__tests__"
  SECRETS_SCAN_OMIT_KEYS = "WHATSAPP_ALLOWED_PHONES,TELEGRAM_ALLOWED_USERS"

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  path = "/api/claude"
  function = "claude"

[[edge_functions]]
  path = "/api/verify-user"
  function = "verify-user"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # script-src no longer allows 'unsafe-inline' — Vite emits external modules.
    # style-src still needs 'unsafe-inline' because App.jsx injects an inline
    # <style id="accent-override"> block at runtime for theme accent colours.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com https://www.google.com https://*.googleusercontent.com https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://*.googleapis.com https://open.er-api.com https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests;"
