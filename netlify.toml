[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  path = "/api/claude"
  function = "claude"

[[edge_functions]]
  path = "/api/verify-user"
  function = "verify-user"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com https://www.google.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://open.er-api.com https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self';"
